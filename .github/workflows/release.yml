name: Release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  publish-check:
    name: Validate publish (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm --filter @jieli/strata-ui build

      # Validates the package is publishable without actually publishing.
      # To release for real: add an NPM_TOKEN secret and switch to `pnpm release`
      # via changesets/action.
      - name: npm publish --dry-run
        working-directory: packages/strata-ui
        run: npm publish --dry-run
